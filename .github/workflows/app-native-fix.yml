name: Apply SAVRDH App Native Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/app-native-fix.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate SAVRDH launcher artwork
        run: |
          cat > /tmp/savrdh-launcher.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#07152f"/>
                <stop offset="0.5" stop-color="#020817"/>
                <stop offset="1" stop-color="#07142b"/>
              </linearGradient>
              <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#fff2a6"/>
                <stop offset="0.22" stop-color="#ffd84f"/>
                <stop offset="0.52" stop-color="#d99a08"/>
                <stop offset="0.78" stop-color="#ffdf59"/>
                <stop offset="1" stop-color="#a96a00"/>
              </linearGradient>
              <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
              </filter>
            </defs>
            <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
            <rect x="130" y="126" width="764" height="772" rx="218" fill="none" stroke="url(#gold)" stroke-width="34" filter="url(#shadow)"/>
            <text x="512" y="736" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="660" font-weight="600" fill="url(#gold)" filter="url(#shadow)">S</text>
          </svg>
          SVG

          cd mobile
          npm install --no-save sharp
          node <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const svg = fs.readFileSync('/tmp/savrdh-launcher.svg');
          Promise.all([
            sharp(svg).resize(1024, 1024).png().toFile('assets/icon.png'),
            sharp(svg).resize(760, 760).extend({ top: 132, bottom: 132, left: 132, right: 132, background: '#020617' }).png().toFile('assets/adaptive-icon.png'),
          ]).catch((e) => { console.error(e); process.exit(1); });
          NODE

      - name: Patch version and Android keyboard behavior
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          app_path = Path('mobile/App.tsx')
          text = app_path.read_text()
          text = text.replace("const CURRENT_APP_VERSION = '1.0.16';", "const CURRENT_APP_VERSION = '1.0.21';")
          text = text.replace(
              "return <KeyboardAvoidingView behavior={Platform.OS === 'ios' ? 'padding' : undefined} style={{ flex: 1 }}>",
              "return <KeyboardAvoidingView behavior={Platform.OS === 'ios' ? 'padding' : 'height'} keyboardVerticalOffset={Platform.OS === 'ios' ? 8 : 0} style={{ flex: 1 }}>"
          )
          text = text.replace(
              '<ScrollView contentContainerStyle={[styles.authWrap, { backgroundColor: theme.bg }]} keyboardShouldPersistTaps="handled">',
              '<ScrollView contentContainerStyle={[styles.authWrap, { backgroundColor: theme.bg }]} keyboardShouldPersistTaps="handled" keyboardDismissMode={Platform.OS === \'ios\' ? \'interactive\' : \'on-drag\'} showsVerticalScrollIndicator={false}>'
          )
          app_path.write_text(text)

          config_path = Path('mobile/app.json')
          config = json.loads(config_path.read_text())
          expo = config['expo']
          expo['version'] = '1.0.21'
          android = expo.setdefault('android', {})
          android['versionCode'] = 21
          android['softwareKeyboardLayoutMode'] = 'resize'
          android['adaptiveIcon'] = {
              'foregroundImage': './assets/adaptive-icon.png',
              'backgroundColor': '#020617'
          }
          expo['icon'] = './assets/icon.png'
          config_path.write_text(json.dumps(config, indent=2) + '\n')
          PY

      - name: Verify fixes
        run: |
          grep -q "CURRENT_APP_VERSION = '1.0.21'" mobile/App.tsx
          grep -q "softwareKeyboardLayoutMode" mobile/app.json
          test -s mobile/assets/icon.png
          test -s mobile/assets/adaptive-icon.png

      - name: Commit native fix
        run: |
          git config user.name "Savrdh Technology"
          git config user.email "savrdhtechnology@gmail.com"
          git add mobile/App.tsx mobile/app.json mobile/assets/icon.png mobile/assets/adaptive-icon.png
          git commit -m "Fix Android keyboard layout and SAVRDH launcher icon"
          git push
