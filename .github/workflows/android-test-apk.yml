name: Build Android Standalone APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-test-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "1"
      JAVA_TOOL_OPTIONS: "-Xmx4g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8"
      EXPO_PUBLIC_SUPABASE_URL: https://qngjmepksxavimwnhtqt.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_rma90Xm4Hy4nT0CEXTlqHQ_6oKKWeds
      EXPO_PUBLIC_WEBSITE_URL: https://savrdhfinancialservices.com
      EXPO_PUBLIC_PORTAL_URL: https://savrdhfinancialservices.com/portal/login
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned dependencies
        run: npm install --include=dev

      - name: Expo dependency check
        run: npx expo install --check

      - name: Type check
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Verify Expo autolinking
        run: npx expo-modules-autolinking resolve --platform android >/tmp/autolinking.json

      - name: Configure Gradle memory
        run: |
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          org.gradle.parallel=false
          org.gradle.daemon=false
          kotlin.compiler.execution.strategy=in-process
          kotlin.daemon.enabled=false
          kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m
          EOF
          echo "--- Effective Gradle memory settings ---"
          tail -n 12 android/gradle.properties

      - name: Build standalone release APK
        timeout-minutes: 35
        env:
          NODE_ENV: production
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --max-workers=1 --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Savrdh-Credit-Resolution.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Savrdh-Credit-Resolution-Release-APK
          path: mobile/dist/Savrdh-Credit-Resolution.apk
          retention-days: 30

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_VERSION="$(node -p "require('./app.json').expo.version")"
          TAG="mobile-release-v${APP_VERSION}"
          gh release create "$TAG" dist/Savrdh-Credit-Resolution.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Savrdh Android v${APP_VERSION}" \
            --notes "Standalone Android release APK connected to the Savrdh CRM and Supabase production database." \
            --latest
