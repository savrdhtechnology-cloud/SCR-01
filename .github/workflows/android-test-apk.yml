name: Build Android Standalone APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-test-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "1"
      NODE_ENV: production
      EXPO_PUBLIC_SUPABASE_URL: https://qngjmepksxavimwnhtqt.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_rma90Xm4Hy4nT0CEXTlqHQ_6oKKWeds
      EXPO_PUBLIC_WEBSITE_URL: https://savrdhfinancialservices.com
      EXPO_PUBLIC_PORTAL_URL: https://savrdhfinancialservices.com/portal/login
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Align Expo dependencies
        run: npx expo install --fix

      - name: Type check
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Savrdh-Credit-Resolution.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Savrdh-Credit-Resolution-Release-APK
          path: mobile/dist/Savrdh-Credit-Resolution.apk
          retention-days: 30

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_VERSION="$(node -p "require('./app.json').expo.version")"
          TAG="mobile-release-v${APP_VERSION}"
          gh release create "$TAG" dist/Savrdh-Credit-Resolution.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Savrdh Android v${APP_VERSION}" \
            --notes "Standalone Android release APK connected to the Savrdh CRM and Supabase production database." \
            --latest
